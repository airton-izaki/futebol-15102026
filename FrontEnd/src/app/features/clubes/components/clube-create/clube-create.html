<div class="container" ngSkipHydration>
  <p-card header="Cadastro de Novo Clube" [style]="{ width: '55rem' }">

    <form (ngSubmit)="salvar()">

      <div class="form-grid">

        <!-- Nome Oficial -->
        <div class="field full">
          <label for="nome_oficial">Nome Oficial do Clube</label>
          <input pInputText id="nome_oficial" [(ngModel)]="clube.nome_oficial" name="nome_oficial" required />
        </div>

        <!-- Nome Popular -->
        <div class="field">
          <label for="nome">Nome Popular (Ex: Corinthians, Flamengo)</label>
          <input pInputText id="nome" [(ngModel)]="clube.nome" name="nome" required />
        </div>

        <!-- Sigla -->
        <div class="field">
          <label for="sigla">Sigla (Ex: SCCP)</label>
          <input pInputText id="sigla" [(ngModel)]="clube.sigla" name="sigla" maxlength="5" required />
        </div>

        <!-- Tipo de Gestão -->
        <div class="field">
          <label for="gestao" class="font-bold block mb-2">Tipo de Gestão</label>
          <select id="gestao" [(ngModel)]="clube.gestao" name="gestao" class="p-inputtext w-full">
            <option value="Associativo">Associativo</option>
            <option value="SAF">SAF</option>
            <option value="Privado">Privado</option>
            <option value="Híbrido">Híbrido</option>
          </select>
        </div>

        <!-- Data de Fundação -->
        <div class="field">
          <label for="fundacao" class="font-bold block mb-2">Data de Fundação</label>
          <input pInputText id="fundacao" type="date" [(ngModel)]="clube.fundacao" name="fundacao" required />
        </div>

        <!-- Estado (UF) -->
        <div class="field">
          <label for="estado" class="font-bold block mb-2">Estado (UF)</label>
          <select id="estado" [(ngModel)]="estadoSelecionado" name="estado" (ngModelChange)="onEstadoChange($event)" class="p-inputtext w-full">
            <option [ngValue]="null">Selecione o Estado</option>
            <option *ngFor="let uf of estados" [ngValue]="uf.id">{{ uf.nome }} ({{ uf.sigla }})</option>
          </select>
        </div>

        <!-- Município -->
        <div class="field">
          <label for="municipio" class="font-bold block mb-2">Município</label>
          <p-autocomplete
            inputId="municipio"
            [(ngModel)]="municipioSelecionado"
            (ngModelChange)="atualizarMunicipioSelecionado($event)"
            (completeMethod)="filtrarMunicipios($event.query)"
            [suggestions]="municipiosFiltrados"
            optionLabel="nome"
            [minLength]="2"
            [delay]="200"
            [forceSelection]="true"
            [showClear]="true"
            [disabled]="!estadoSelecionado"
            placeholder="Digite o nome do município"
            [inputStyle]="{ width: '100%' }"
            styleClass="w-full"
            name="municipio"
            required>
          </p-autocomplete>
          <small class="field-hint" *ngIf="carregandoMunicipios">Carregando municípios do estado selecionado...</small>
        </div>

        <!-- Estádio -->
        <div class="field">
          <label for="estadio" class="font-bold block mb-2">Estádio</label>
          <input pInputText id="estadio" [(ngModel)]="clube.estadio" name="estadio" class="w-full" />
        </div>

        <!-- Website -->
        <div class="field">
          <label for="website" class="font-bold block mb-2">Website Oficial</label>
          <input pInputText id="website" [(ngModel)]="clube.website" name="website" class="w-full" />
        </div>

        <!-- Cores do Clube (Principal, Secundária, Terciária) -->
        <div class="field">
          <label for="cor_principal" class="font-bold block mb-2">Cor Principal</label>
          <input pInputText id="cor_principal" [(ngModel)]="clube.cor_principal" name="cor_principal" placeholder="Ex: Preto" class="w-full" />
        </div>

        <div class="field">
          <label for="cor_secundaria" class="font-bold block mb-2">Cor Secundária</label>
          <input pInputText id="cor_secundaria" [(ngModel)]="clube.cor_secundaria" name="cor_secundaria" placeholder="Ex: Branco" class="w-full" />
        </div>

        <div class="field">
          <label for="cor_terciaria" class="font-bold block mb-2">Cor Terciária</label>
          <input pInputText id="cor_terciaria" [(ngModel)]="clube.cor_terciaria" name="cor_terciaria" placeholder="Ex: Vermelho" class="w-full" />
        </div>

        <!-- Escudo e Status Ativo -->
        <div class="field">
          <label for="escudo" class="font-bold block mb-2">URL do Escudo</label>
          <input pInputText id="escudo" [(ngModel)]="clube.escudo" name="escudo" placeholder="https://..." class="w-full" />
        </div>

        <div class="field">
          <label for="ativo" class="font-bold block mb-2">Ativo</label>
          <select id="ativo" [(ngModel)]="clube.ativo" name="ativo" class="p-inputtext w-full">
            <option [ngValue]="true">Sim</option>
            <option [ngValue]="false">Não</option>
          </select>
        </div>

        <!-- Descrição -->
        <div class="field full">
          <label for="descricao" class="font-bold block mb-2">Descrição / História</label>
          <textarea pInputTextarea id="descricao" [(ngModel)]="clube.descricao" name="descricao" rows="3" class="w-full"></textarea>
        </div>

      </div>

      <!-- Botões de Ação -->
      <div class="actions">
        <p-button label="Limpar" icon="pi pi-times" styleClass="p-button-secondary" (click)="limpar()" type="button"></p-button>
        <p-button label="Salvar Clube" icon="pi pi-check" styleClass="p-button-success" type="submit"></p-button>
      </div>

    </form>

  </p-card>
</div>
